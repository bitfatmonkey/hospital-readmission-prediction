[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-readmission-prediction"
version = "0.1.0"
description = "Reproducible, patient-aware discharge-time readmission modelling on the real UCI dataset"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas==3.0.6", "numpy==2.4.6", "scikit-learn==1.9.1",
  "xgboost-cpu==3.2.0", "shap==0.51.0", "matplotlib==3.11.2",
  "seaborn==0.13.2", "scipy==1.17.1", "ucimlrepo==0.0.7",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
notebooks = ["nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0"]

[tool.setuptools.packages.find]
include = ["hospital_readmission*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:The set_bad function:PendingDeprecationWarning:shap.*",
  "ignore:The set_over function:PendingDeprecationWarning:shap.*",
  "ignore:The set_under function:PendingDeprecationWarning:shap.*",
]
